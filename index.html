<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1410" />
  <title>清酒釀造流水線｜互動式動畫</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1410'/%3E%3Ccircle cx='16' cy='18' r='9' fill='%23e0b25a'/%3E%3Crect x='14' y='6' width='4' height='6' rx='1' fill='%23e0b25a'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #1a1410;
      --panel: rgba(18, 14, 12, 0.92);
      --ink: #f4efe6;
      --muted: #c4b8a8;
      --gold: #e0b25a;
      --line: rgba(224, 178, 90, 0.28);
      --shadow: 0 18px 50px rgba(0,0,0,.45);
      --ui: "Noto Sans TC", "PingFang TC", "Hiragino Sans CNS", "Microsoft JhengHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--ui); overflow: hidden; }
    #canvas-wrap { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .ui { position: relative; z-index: 2; pointer-events: none; }
    .ui > * { pointer-events: auto; }
    header {
      position: fixed; top: 0; left: 0; right: 0;
      padding: calc(14px + env(safe-area-inset-top)) 18px 10px;
      background: linear-gradient(to bottom, rgba(26,20,16,.92), rgba(26,20,16,0));
    }
    header h1 { margin: 0; font-size: clamp(18px, 3vw, 24px); font-weight: 700; letter-spacing: .04em; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .hint { color: var(--gold); font-size: 12px; margin-top: 6px; }
    .lane-nav {
      position: fixed; left: 0; right: 0;
      bottom: calc(118px + env(safe-area-inset-bottom));
      display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 6px;
      scrollbar-width: thin; -webkit-overflow-scrolling: touch;
    }
    .lane-nav button {
      flex: 0 0 auto; border: 2px solid var(--lane, var(--gold));
      background: rgba(26,20,16,.78); color: var(--ink);
      border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 12px;
      cursor: pointer; white-space: nowrap;
    }
    .lane-nav button[aria-current="true"] { background: var(--lane, var(--gold)); color: #1a1410; font-weight: 700; }
    .step-nav {
      position: fixed; left: 0; right: 0;
      bottom: calc(76px + env(safe-area-inset-bottom));
      display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 6px;
      scrollbar-width: thin; -webkit-overflow-scrolling: touch;
    }
    .step-nav button {
      flex: 0 0 auto; border: 1px solid var(--line); background: rgba(26,20,16,.78);
      color: var(--ink); border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 12px;
      cursor: pointer; white-space: nowrap;
    }
    .step-nav button[aria-current="true"] { background: var(--gold); color: #1a1410; border-color: var(--gold); font-weight: 700; }
    .dock {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(14px + env(safe-area-inset-bottom));
      display: flex; gap: 8px; background: var(--panel);
      border: 1px solid var(--line); border-radius: 999px; padding: 6px; box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .dock button {
      min-width: 44px; min-height: 44px; border: 0; border-radius: 999px;
      background: transparent; color: var(--ink); font: inherit; font-size: 14px;
      cursor: pointer; padding: 0 16px; font-weight: 600;
    }
    .dock button.primary { background: var(--gold); color: #1a1410; }
    aside.panel {
      position: fixed; top: 0; right: 0; width: min(420px, 100%); height: 100%;
      background: var(--panel); border-left: 1px solid var(--line);
      transform: translateX(110%); transition: transform .45s cubic-bezier(.2,.8,.2,1);
      overflow: auto; padding: calc(18px + env(safe-area-inset-top)) 20px 120px;
      box-shadow: var(--shadow); backdrop-filter: blur(16px);
    }
    aside.panel.open { transform: translateX(0); }
    .panel-close {
      position: sticky; top: 0; float: right; width: 40px; height: 40px;
      border: 1px solid var(--line); background: rgba(255,255,255,.06);
      color: var(--ink); border-radius: 50%; cursor: pointer; font-size: 20px;
    }
    .kicker { color: var(--gold); font-size: 12px; letter-spacing: .16em; font-weight: 700; }
    aside h2 { margin: 6px 0 4px; font-size: 26px; line-height: 1.25; }
    .romaji { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
    .block { margin: 0 0 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
    .block h3 { margin: 0 0 8px; font-size: 13px; color: var(--gold); letter-spacing: .08em; }
    .block p, .block li { margin: 0; font-size: 14px; line-height: 1.7; color: var(--ink); }
    .block ul { margin: 0; padding-left: 1.1em; }
    .block li + li { margin-top: 6px; }
    .exam { border-color: rgba(224,178,90,.55); background: rgba(224,178,90,.08); }
    .diagram { padding: 10px 10px 8px; }
    .diagram svg { display: block; width: 100%; height: auto; }
    .diagram .cap { margin: 8px 0 0; font-size: 11px; color: var(--muted); line-height: 1.55; }
    .dock .speed { display: flex; align-items: center; gap: 2px; padding: 0 4px; }
    .dock .speed button { min-width: 40px; min-height: 36px; padding: 0 8px; font-size: 13px; border-radius: 999px; }
    .dock .speed button[aria-pressed="true"] { background: var(--gold); color: #1a1410; }
    .labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .label {
      position: absolute; left: 0; top: 0; transform: translate(-50%, -120%);
      background: rgba(18,14,12,.78); color: var(--ink); border: 1px solid var(--line);
      border-radius: 999px; padding: 3px 9px; font-size: 11px; white-space: nowrap; opacity: 0;
    }
    .label.on { opacity: 1; }
    .label.active { background: var(--gold); color: #1a1410; border-color: var(--gold); font-weight: 700; }
    .loading { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #1a1410; color: var(--ink); }
    .loading.hide { opacity: 0; pointer-events: none; transition: opacity .5s; }
    @media (max-width: 720px) {
      aside.panel {
        top: auto; left: 0; width: 100%; height: auto; max-height: 58vh;
        border-left: 0; border-top: 1px solid var(--line);
        transform: translateY(110%); border-radius: 20px 20px 0 0;
        padding: 16px 16px calc(126px + env(safe-area-inset-bottom));
      }
      aside.panel.open { transform: translateY(0); }
      header p { display: none; }
      .lane-nav { bottom: calc(112px + env(safe-area-inset-bottom)); }
      .step-nav { bottom: calc(70px + env(safe-area-inset-bottom)); }
    }
  </style>

<body>
  <div id="canvas-wrap"></div>
  <div class="labels" id="labels"></div>
  <div class="ui">
    <header>
      <div>
        <h1>清酒釀造流水線</h1>
        <p>從精米（seimai）到瓶詰（binzume）。濾過之後依火入れ分成四條路線：一般酒、生貯藏酒、生詰酒、生酒（本生）。內容與酒研考試重點一致。</p>
        <div class="hint">拖曳可旋轉視角　點機台或分流路線看細節　可自動導覽　輸送帶預設為慢速</div>
      </div>
    </header>
    <nav class="lane-nav" id="laneNav" aria-label="火入れ分流路線"></nav>
    <nav class="step-nav" id="stepNav" aria-label="釀造步驟"></nav>
    <div class="dock">
      <button type="button" id="btnPrev">上一步</button>
      <div class="speed" role="group" aria-label="輸送帶速度">
        <button type="button" data-speed="0.5" aria-pressed="true" title="更慢，預設">0.5×</button>
        <button type="button" data-speed="1" aria-pressed="false" title="約為原本的三分之一">1×</button>
        <button type="button" data-speed="2" aria-pressed="false">2×</button>
      </div>
      <button type="button" id="btnTour" class="primary" aria-pressed="false">自動導覽</button>
      <button type="button" id="btnNext">下一步</button>
    </div>
    <aside class="panel" id="panel" aria-hidden="true">
      <button type="button" class="panel-close" id="btnClose" aria-label="關閉">×</button>
      <div id="panelBody"></div>
    </aside>
  </div>
  <div class="loading" id="loading"><div>正在準備釀造場…</div></div>
  <script type="module">

import * as THREE from "three";

function stageAt(x, dist) {
  if (dist >= MAIN_BELT_LEN + FAN_LEN) {
    if (x > BRANCH_X0 + BRANCH_PITCH * 2.55) return "bottle";
    return "sake";
  }
  const rel = x - ORIGIN;
  if (rel < PITCH * 0.45) return "genmai";
  if (rel < PITCH * 1.45) return "hakumai";
  if (rel < PITCH * 2.45) return "wet";
  if (rel < PITCH * 3.45) return "steamed";
  if (rel < PITCH * 4.45) return "koji";
  if (rel < PITCH * 5.45) return "shubo";
  if (rel < PITCH * 6.45) return "moromi";
  return "sake";
}

function animateWorkers(t) {
  workers.forEach((w) => {
    const u = w.userData;
    const s = t * 1.5 + u.phase;
    const la = u.lArm, ra = u.rArm, ll = u.lLeg, rl = u.rLeg;
    if (u.anim === "pour") {
      ra.rotation.x = -0.85 + Math.sin(s) * 0.55;
      la.rotation.x = -0.7 + Math.sin(s) * 0.4;
      ra.rotation.z = 0.15;
      w.rotation.x = 0.1 + Math.sin(s) * 0.07;
      if (u.sack) u.sack.rotation.x = 0.2 + Math.max(0, Math.sin(s)) * 0.9;
    } else if (u.anim === "wash") {
      ra.rotation.x = -1.05;
      la.rotation.x = -1.0;
      ra.rotation.y = Math.sin(s) * 0.55;
      la.rotation.y = -Math.sin(s) * 0.5;
      ra.rotation.z = 0.35 + Math.cos(s) * 0.25;
      la.rotation.z = -0.35 - Math.cos(s) * 0.25;
      w.position.y = Math.sin(s * 2) * 0.015;
    } else if (u.anim === "carry" || u.anim === "load") {
      const k = (Math.sin(s * 0.35) + 1) / 2;
      w.position.x = u.x0 + (u.x1 - u.x0) * k;
      w.position.z = u.z0 + (u.z1 - u.z0) * k;
      const going = Math.cos(s * 0.35) >= 0;
      w.rotation.y = going ? 0 : Math.PI;
      ll.rotation.x = Math.sin(s * 3.2) * 0.5;
      rl.rotation.x = -Math.sin(s * 3.2) * 0.5;
      ra.rotation.x = -0.85;
      la.rotation.x = -0.85;
      w.position.y = Math.abs(Math.sin(s * 3.2)) * 0.03;
    } else if (u.anim === "turn") {
      w.rotation.x = 0.22;
      ra.rotation.x = -0.95 + Math.sin(s) * 0.45;
      la.rotation.x = -0.85 - Math.sin(s) * 0.4;
      ra.rotation.z = 0.2;
      la.rotation.z = -0.2;
      ra.rotation.y = Math.sin(s * 0.8) * 0.35;
    } else if (u.anim === "stir") {
      w.rotation.x = 0.12;
      ra.rotation.x = -0.55;
      ra.rotation.y = Math.sin(s * 0.8) * 0.7;
      ra.rotation.z = 0.4 + Math.cos(s * 0.8) * 0.25;
      la.rotation.x = -0.3;
      la.rotation.z = -0.15;
    } else if (u.anim === "watch") {
      if (u.head) u.head.rotation.y = Math.sin(s * 0.4) * 0.45;
      ra.rotation.x = 0.15;
      la.rotation.x = 0.15;
      ra.rotation.z = 0.12;
      la.rotation.z = -0.12;
      w.position.y = Math.sin(s * 0.8) * 0.01;
    } else if (u.anim === "bottle") {
      ra.rotation.x = -0.4 + Math.sin(s) * 0.7;
      la.rotation.x = -0.6 + Math.sin(s + 0.4) * 0.25;
      w.position.y = Math.max(0, Math.sin(s)) * 0.04;
    }
  });
}

function poseCargoItem(item, i, x, y, z, t) {
  hideCargo(i);
  const dist = (item.t * PATH_LEN + beltPos) % PATH_LEN;
  const st = stageAt(x, dist);
  const splitX = ORIGIN + PITCH * 6.45;
  if (st === "bottle") {
    return st;
  }
  const bob = Math.sin(t * 3 + item.phase) * 0.012;
  if (st === "genmai" || st === "hakumai" || st === "wet" || st === "steamed" || st === "koji") {
    putCargo(cargo[st], i, x, y + bob, z, 1, 1, 1, 0, item.spin + t * 0.2, 0);
    if (st === "koji") putCargo(cargo.kojiFuzz, i, x, y + 0.04 + bob, z, 1.15, 1.2, 1.15);
    if (st === "steamed") {
      const fade = 0.12 + (Math.sin(t * 2 + item.phase) * 0.5 + 0.5) * 0.18;
      putCargo(cargo.steam, i, x, y + 0.28 + (t * 0.25 + item.phase) % 0.35, z, 1.1, 1.1, 1.1);
    }
  } else if (st === "shubo") {
    putCargo(cargo.shubo, i, x, 1.05, z, 1, 1, 1, 0, item.spin * 0.2, 0);
    putCargo(cargo.shuboLiq, i, x, 1.02, z);
  } else if (st === "moromi") {
    putCargo(cargo.moromi, i, x, 0.98, z);
    putCargo(cargo.moromiLiq, i, x, 1.02, z);
    putCargo(cargo.bubble, i, x + Math.cos(t * 2 + item.phase) * 0.08, 1.12 + (t * 0.7 + item.phase) % 0.18, z);
  } else if (st === "sake") {
    putCargo(cargo.sake, i, x, 1.06, z);
    putCargo(cargo.sakeLiq, i, x, 1.0, z);
    if (x > splitX || dist >= MAIN_BELT_LEN) {
      const dlt = dist >= MAIN_BELT_LEN ? 2.2 : Math.max(0, x - splitX);
      const kz = MAIN_Z + item.z + Math.min(2.3, dlt * 0.9);
      const kx = Math.min(x, splitX + 0.8 + (item.lane * 0.15));
      const ky = 0.86 + Math.min(0.15, dlt * 0.04);
      putCargo(cargo.kasu, i, kx, ky, kz, 1, 1, 1, 0.1, item.spin, 0.15);
    }
  }
  return st;
}

    { pct: 0.06, color: 0x6a4a1c },

    { pct: 0.30, color: 0xd0b25a },

  (BUILDERS[st.id] || buildWash)(g);
  const base = box(3.6, 0.16, 3.4, mat.darkWood, 0, 0.08, -0.3);
  g.add(base);
  const hit = new THREE.Mesh(new THREE.BoxGeometry(3.6, 3.2, 3.6), new THREE.MeshBasicMaterial({ visible: false }));
  hit.position.set(0, 1.6, -0.2);
  hit.userData.index = i;
  g.add(hit);
  clickables.push(hit);
  const ring = highlightRing();
  g.add(ring);
  g.userData.ring = ring;
  scene.add(g);
  stationGroups.push(g);
  addLabel(g, `${i + 1}. ${st.name}`);
  lamp(ORIGIN + i * PITCH, 0);
});

const laneGroups = [];
const columnRings = [[], [], [], []];
let selectedLane = -1;

function colorMat(color, extra = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.25, ...extra });
}

function compactPasteur(g) {
  g.add(box(1.7, 0.7, 0.7, mat.heat, 0, 0.95, 0));
  g.add(cyl(0.14, 0.14, 1.5, mat.copper, -0.45, 1.4, 0));
  g.add(cyl(0.14, 0.14, 1.5, mat.copper, 0.45, 1.4, 0));
  for (let i = 0; i < 6; i++) {
    const puff = sphere(0.11, mat.steam.clone(), (i - 2.5) * 0.22, 1.55, 0);
    puff.userData.phase = i * 0.5;
    steamPuffs.push(puff);
    g.add(puff);
  }
}

function skipGate(g, color) {
  const m = colorMat(color);
  g.add(box(0.1, 1.7, 0.1, mat.metal, -0.7, 1.05, 0));
  g.add(box(0.1, 1.7, 0.1, mat.metal, 0.7, 1.05, 0));
  g.add(box(1.6, 0.1, 0.1, m, 0, 1.9, 0));
  g.add(box(1.4, 0.08, 1.4, new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.18 }), 0, 0.2, 0));
}

function compactStorage(g, cold) {
  const tank = cold
    ? new THREE.MeshStandardMaterial({ color: 0x8ec5e8, metalness: 0.45, roughness: 0.28, emissive: 0x163044, emissiveIntensity: 0.25 })
    : mat.tank;
  g.add(cyl(0.62, 0.62, 1.9, tank, 0, 1.15, 0));
  g.add(cyl(0.18, 0.18, 0.18, mat.metal, 0, 2.2, 0));
  if (cold) {
    for (let i = 0; i < 6; i++) {
      const fl = sphere(0.06, new THREE.MeshStandardMaterial({ color: 0xe8f6ff, transparent: true, opacity: 0.45, depthWrite: false }), (Math.random() - 0.5) * 0.7, 1.4 + Math.random() * 0.8, (Math.random() - 0.5) * 0.7);
      fl.userData.phase = i;
      steamPuffs.push(fl);
      g.add(fl);
    }
  }
}

function compactWarimizu(g) {
  g.add(cyl(0.55, 0.6, 1.3, mat.tank, -0.35, 0.95, 0));
  g.add(cyl(0.35, 0.35, 0.9, mat.tank, 0.55, 0.75, 0));
  g.add(box(0.1, 0.1, 0.7, mat.metal, 0.1, 1.55, 0));
}

function displayBottles(g, lane) {
  const L = LANES[lane];
  const glass = colorMat(L.color, { transparent: true, opacity: 0.8, roughness: 0.25, metalness: 0.2 });
  if (L.cold) {
    g.add(box(2.2, 1.5, 1.1, new THREE.MeshStandardMaterial({ color: 0x9fd2f0, transparent: true, opacity: 0.18, metalness: 0.2, roughness: 0.2 }), 0.15, 1.15, 0));
  }
  g.add(box(2.0, 0.14, 0.8, mat.metal, 0, 0.62, 0));
  for (let i = 0; i < 5; i++) {
    const btl = cyl(0.11, 0.15, 0.52, glass, -0.8 + i * 0.4, 1.0, 0);
    btl.userData.bob = true;
    btl.userData.phase = i * 0.7 + lane;
    bobbers.push(btl);
    g.add(btl);
    g.add(cyl(0.055, 0.06, 0.14, mat.metal, -0.8 + i * 0.4, 1.32, 0));
  }
}

function makeLaneBelt(z, color) {
  const mid = (BRANCH_X0 + LANE_BELT_END) / 2;
  const len = LANE_BELT_END - BRANCH_X0 + 0.6;
  const g = new THREE.Group();
  g.add(box(len, 0.12, 1.35, new THREE.MeshStandardMaterial({ color: 0x2c241c, roughness: 0.7 }), mid, 0.68, z));
  g.add(box(len, 0.08, 0.08, colorMat(color), mid, 0.74, z - 0.64));
  g.add(box(len, 0.08, 0.08, colorMat(color), mid, 0.74, z + 0.64));
  for (let i = 0; i < 10; i++) {
    const slat = box(0.6, 0.05, 1.2, mat.slat, 0, 0.76, z);
    slat.userData.offset = i / 10;
    slat.userData.laneZ = z;
    slat.userData.kind = "lane";
    laneSlats.push(slat);
    g.add(slat);
  }
  scene.add(g);
}

function addFanBelt(z, color) {
  const dx = BRANCH_X0 - ROKA_X;
  const dz = z - MAIN_Z;
  const len = Math.hypot(dx, dz);
  const g = new THREE.Group();
  const b = box(len, 0.12, 0.7, new THREE.MeshStandardMaterial({ color: 0x2a221a, roughness: 0.7 }), 0, 0.68, 0);
  g.add(b);
  g.add(box(len, 0.06, 0.07, colorMat(color), 0, 0.75, -0.32));
  g.add(box(len, 0.06, 0.07, colorMat(color), 0, 0.75, 0.32));
  g.position.set((ROKA_X + BRANCH_X0) / 2, 0, (MAIN_Z + z) / 2);
  g.rotation.y = -Math.atan2(dz, dx);
  scene.add(g);
}

function addClickHit(parent, w, h, d, x, y, z, data) {
  const hit = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ visible: false }));
  hit.position.set(x, y, z);
  Object.assign(hit.userData, data);
  parent.add(hit);
  clickables.push(hit);
}

function buildBranchYard() {
  LANES.forEach((L, li) => {
    addFanBelt(LANE_Z[li], L.color);
    makeLaneBelt(LANE_Z[li], L.color);
    const lg = new THREE.Group();
    lg.position.set(0, 0, LANE_Z[li]);
    lg.userData.lane = li;

    const modules = [
      { slot: 0, build: L.hiire1 ? compactPasteur : (g) => skipGate(g, L.color), index: 8, role: L.hiire1 ? "hiire1" : "skip1" },
      { slot: 1, build: (g) => compactStorage(g, L.cold), index: 9, role: "chozo" },
      { slot: 2, build: compactWarimizu, index: 10, role: "warimizu" },
      { slot: 3, build: (g) => { if (L.hiire2) compactPasteur(g); displayBottles(g, li); }, index: 11, role: L.hiire2 ? "hiire2" : "skip2" }
    ];
    modules.forEach((mod) => {
      const mg = new THREE.Group();
      mg.position.set(branchX(mod.slot), 0, 0);
      mod.build(mg);
      const ring = highlightRing();
      ring.scale.setScalar(0.7);
      mg.add(ring);
      columnRings[mod.slot].push(ring);
      addClickHit(mg, 2.6, 2.6, 2.0, 0, 1.3, 0, { index: mod.index, lane: li, role: mod.role, kind: "module" });
      lg.add(mg);
    });

    const sign = new THREE.Group();
    sign.position.set(BRANCH_X0 - 1.6, 0, 0);
    const plate = box(0.08, 0.7, 1.8, colorMat(L.color), 0, 1.6, 0);
    sign.add(plate);
    addClickHit(sign, 1.2, 2.2, 2.2, 0, 1.4, 0, { kind: "lane", lane: li });
    lg.add(sign);
    addLabel(sign, `${L.short}`);
    labelNodes[labelNodes.length - 1].el.style.borderColor = L.css;
    scene.add(lg);
    laneGroups.push(lg);
    lamp(branchX(1), LANE_Z[li]);
  });

  ["一次火入れ", "貯藏", "割水", "二次火入れ・瓶詰"].forEach((name, slot) => {
    const g = new THREE.Group();
    g.position.set(branchX(slot), 0, 0);
    g.userData.index = MAIN_COUNT + slot;
    g.userData.id = STATIONS[MAIN_COUNT + slot].id;
    const ring = highlightRing();
    ring.scale.setScalar(2.2);
    g.add(ring);
    g.userData.ring = ring;
    addLabel(g, `${MAIN_COUNT + slot + 1}. ${name}`);
    scene.add(g);
    stationGroups.push(g);
    lamp(branchX(slot), 0);
  });
}

const camTo = new THREE.Vector3();

const tgtTo = new THREE.Vector3();

let selected = -1;

function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function stationCamera(i) {
  if (i < MAIN_COUNT) {
    const x = ORIGIN + i * PITCH;
    return { pos: new THREE.Vector3(x + 0.4, 5.6, 8.6), target: new THREE.Vector3(x, 1.4, 0) };
  }
  const x = branchX(i - MAIN_COUNT);
  return { pos: new THREE.Vector3(x + 0.4, 9.2, 16.5), target: new THREE.Vector3(x, 1.3, 0) };
}

function laneCamera(li) {
  const mid = BRANCH_X0 + BRANCH_SPAN * 0.42;
  return { pos: new THREE.Vector3(mid - 0.6, 5.4, LANE_Z[li] + 7.4), target: new THREE.Vector3(mid, 1.2, LANE_Z[li]) };
}

function tweenCamera(pos, target, duration = 1.15) {
  camFrom.copy(camera.position);
  tgtFrom.copy(controls.target);
  camTo.copy(pos);
  tgtTo.copy(target);
  camTween = { t: 0, dur: duration };
}

function moveCameraTo(i, duration = 1.15) {
  const v = stationCamera(i);
  tweenCamera(v.pos, v.target, duration);
}

function routesSvg(hiLane = -1, hiCol = -1) {
  const cols = ["①火入れ", "貯藏", "割水", "②火入れ", "瓶詰"];
  const rowH = 44;
  const h = 28 + LANES.length * rowH;
  const rows = LANES.map((L, i) => {

    const cells = [
      { on: L.hiire1, label: L.hiire1 ? "一次" : "繞道", col: 0 },
      { on: true, label: L.cold ? "低溫貯藏" : (L.hiire1 ? "貯藏" : "生のまま"), col: 1 },
      { on: true, label: "割水", col: 2 },
      { on: L.hiire2, label: L.hiire2 ? "二次" : "繞道", col: 3 },
      { on: true, label: "瓶", col: 4 }
    ];
    const rowHi = hiLane === i;
    const cellRects = cells.map((c, ci) => {
      const x = 92 + ci * 52;
      const fill = !c.on ? "#2a1c14" : (rowHi || hiCol === c.col ? L.css : `${L.css}bb`);
      const stroke = (rowHi || hiCol === c.col) ? "#f4efe6" : "#6a5a48";

    }).join("");

function setNavCurrent(i, lane = -1) {
  [...stepNav.children].forEach((el, idx) => el.setAttribute("aria-current", lane < 0 && idx === i ? "true" : "false"));
  [...laneNav.children].forEach((el, idx) => el.setAttribute("aria-current", idx === lane ? "true" : "false"));
  const cur = lane >= 0 ? laneNav.children[lane] : stepNav.children[i];
  if (cur) cur.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
}

function setHighlights(stationIdx, laneIdx) {
  stationGroups.forEach((g, idx) => {
    const ring = g.userData.ring;
    if (!ring) return;
    const on = laneIdx < 0 && idx === stationIdx;
    ring.material.opacity = on ? 0.95 : 0;
  });
  columnRings.forEach((arr, slot) => {
    arr.forEach((ring, li) => {
      const on = (laneIdx < 0 && stationIdx === MAIN_COUNT + slot) || laneIdx === li;
      ring.material.opacity = on ? 0.95 : 0;
    });
  });
}

function openPanel() {
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
}

function selectStation(i, open = true, laneHint = -1) {
  if (i < 0) i = STATIONS.length - 1;
  if (i >= STATIONS.length) i = 0;
  selected = i;
  selectedLane = -1;
  setHighlights(i, -1);
  labelNodes.forEach((n) => {
    n.el.classList.toggle("active", stationGroups.indexOf(n.group) === i);
  });
  setNavCurrent(i, -1);
  moveCameraTo(i);
  if (open) {
    renderPanel(i, laneHint);
    openPanel();
  }
  tourTimer = 0;
}

function selectLane(li, open = true) {
  if (li < 0) li = LANES.length - 1;
  if (li >= LANES.length) li = 0;
  selected = MAIN_COUNT;
  selectedLane = li;
  setHighlights(-1, li);
  labelNodes.forEach((n) => n.el.classList.toggle("active", n.el.textContent === LANES[li].short));
  setNavCurrent(-1, li);
  const v = laneCamera(li);
  tweenCamera(v.pos, v.target);
  if (open) {
    renderLanePanel(li);
    openPanel();
  }
  tourTimer = 0;
}

function closePanel() {
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
}

document.getElementById("btnClose").addEventListener("click", closePanel);
document.getElementById("btnPrev").addEventListener("click", () => {
  touring = false;
  syncTourBtn();
  selectStation(selected < 0 ? 0 : selected - 1, true);
});
document.getElementById("btnNext").addEventListener("click", () => {
  touring = false;
  syncTourBtn();
  selectStation(selected < 0 ? 0 : selected + 1, true);
});

const btnTour = document.getElementById("btnTour");
function syncTourBtn() {
  btnTour.textContent = touring ? "停止導覽" : "自動導覽";
  btnTour.setAttribute("aria-pressed", touring ? "true" : "false");
}
btnTour.addEventListener("click", () => {
  touring = !touring;
  syncTourBtn();
  if (touring) {
    if (selected < 0) selectStation(0, true);
    else selectStation(selected, true);
    tourTimer = 0;
  }
});

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const ptr = { x: 0, y: 0, t: 0, down: false };

function setPointer(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  const x = ev.clientX ?? (ev.touches && ev.touches[0].clientX) ?? 0;
  const y = ev.clientY ?? (ev.touches && ev.touches[0].clientY) ?? 0;
  pointer.x = ((x - r.left) / r.width) * 2 - 1;
  pointer.y = -((y - r.top) / r.height) * 2 + 1;
  return { x, y };
}

function onPointerDown(ev) {
  if (ev.target !== renderer.domElement) return;
  const p = setPointer(ev);
  ptr.x = p.x; ptr.y = p.y; ptr.t = performance.now(); ptr.down = true;
}
function onPointerUp(ev) {
  if (!ptr.down) return;
  ptr.down = false;
  const p = setPointer(ev);
  const dt = performance.now() - ptr.t;
  const dist = Math.hypot(p.x - ptr.x, p.y - ptr.y);
  if (dist > 8 || dt > 700) return;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickables, false);
  if (hits.length) {
    touring = false;
    syncTourBtn();
    const ud = hits[0].object.userData;
    if (ud.kind === "lane") selectLane(ud.lane, true);
    else selectStation(ud.index, true, ud.lane ?? -1);
  }
}
renderer.domElement.addEventListener("pointerdown", onPointerDown);
renderer.domElement.addEventListener("pointerup", onPointerUp);

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
const BELT_BASE = 0.04 / 3;
let beltMul = 0.5;
let beltPos = 0;
function setBeltSpeed(mul) {
  beltMul = mul;
  document.querySelectorAll(".dock .speed button").forEach((b) => {
    b.setAttribute("aria-pressed", Number(b.dataset.speed) === mul ? "true" : "false");
  });
}
document.querySelectorAll(".dock .speed button").forEach((b) => {
  b.addEventListener("click", () => setBeltSpeed(Number(b.dataset.speed)));
});
window.__setBeltSpeed = setBeltSpeed;

const tmpV = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  if (camTween) {
    camTween.t += dt;
    const k = easeInOutCubic(Math.min(1, camTween.t / camTween.dur));
    camera.position.lerpVectors(camFrom, camTo, k);
    controls.target.lerpVectors(tgtFrom, tgtTo, k);
    if (camTween.t >= camTween.dur) camTween = null;
  } else if (touring && (selected >= 0 || selectedLane >= 0)) {
    tourTimer += dt;
    if (tourTimer > 7) {
      tourTimer = 0;
      if (selectedLane >= 0) {
        if (selectedLane < LANES.length - 1) selectLane(selectedLane + 1, true);
        else selectStation(0, true);
      } else if (selected === STATIONS.length - 1) {
        selectLane(0, true);
      } else {
        selectStation(selected + 1, true);
      }
    }
  }

  controls.update();

  beltPos += dt * WORLD_SPEED * beltMul;
  slats.forEach((s) => {
    const u = (s.userData.offset + beltPos / MAIN_BELT_LEN) % 1;
    s.position.x = MAIN_BELT_START + u * MAIN_BELT_LEN;
  });
  laneSlats.forEach((s) => {
    const span = LANE_BELT_END - BRANCH_X0;
    const u = (s.userData.offset + beltPos / span) % 1;
    s.position.x = BRANCH_X0 + u * span;
  });

  const hide = new THREE.Matrix4().makeScale(0, 0, 0);
  const bottleCounts = [0, 0, 0, 0];
  cargoItems.forEach((item, i) => {
    const dist = (item.t * PATH_LEN + beltPos) % PATH_LEN;
    let x, y, z;
    if (dist < MAIN_BELT_LEN) {
      const k = dist / MAIN_BELT_LEN;
      x = MAIN_BELT_START + k * MAIN_BELT_LEN;
      y = 0.98;
      z = MAIN_Z + item.z;
    } else if (dist < MAIN_BELT_LEN + FAN_LEN) {
      const k = (dist - MAIN_BELT_LEN) / FAN_LEN;
      x = ROKA_X + k * (BRANCH_X0 - ROKA_X);
      y = 0.98;
      z = MAIN_Z * (1 - k) + LANE_Z[item.lane] * k + item.z * (1 - k * 0.7);
    } else {
      const k = dist - MAIN_BELT_LEN - FAN_LEN;
      x = BRANCH_X0 + k;
      y = 0.98;
      z = LANE_Z[item.lane] + item.z * 0.3;
    }
    const st = poseCargoItem(item, i, x, y, z, t);
    if (st === "bottle") {
      const bi = bottleCounts[item.lane]++;
      if (bi < 28) {
        riceDummy.scale.set(1, 1, 1);
        riceDummy.position.set(x, 1.05 + Math.sin(t * 2 + i) * 0.03, z);
        riceDummy.rotation.set(0, 0, 0);
        riceDummy.updateMatrix();
        bottleMeshes[item.lane].setMatrixAt(bi, riceDummy.matrix);
        riceDummy.position.y += 0.34;
        riceDummy.updateMatrix();
        capMeshes[item.lane].setMatrixAt(bi, riceDummy.matrix);
      }
    }
  });
  CARGO_KEYS.forEach((k) => { cargo[k].instanceMatrix.needsUpdate = true; });
  bottleMeshes.forEach((m, li) => {
    for (let k = bottleCounts[li]; k < 28; k++) m.setMatrixAt(k, hide);
    m.instanceMatrix.needsUpdate = true;
    const caps = capMeshes[li];
    for (let k = bottleCounts[li]; k < 28; k++) caps.setMatrixAt(k, hide);
    caps.instanceMatrix.needsUpdate = true;
  });
  animateWorkers(t);

  steamPuffs.forEach((p) => {
    const ph = t * 0.7 + p.userData.phase;
    if (!p.userData.anchored) {
      p.position.y = (p.userData.baseY || 2.3) + (ph % 1.6);
    }
    const fade = 1 - ((ph % 1.6) / 1.6);
    p.material.opacity = 0.08 + fade * 0.18;
    const s = 0.6 + (ph % 1.6) * 0.5;
    p.scale.setScalar(s);
  });

  bubbles.forEach((b) => {
    const ph = t * 0.9 + b.userData.phase;
    const ang = ph * 0.7;
    const ox = b.userData.ox || 0;
    const oz = b.userData.oz || 0;
    b.position.x = ox + Math.cos(ang) * b.userData.r * 0.5;
    b.position.z = oz + Math.sin(ang) * b.userData.r * 0.4;
    b.position.y = b.userData.baseY + (ph % 1) * b.userData.amp;
  });

  bobbers.forEach((m) => {
    if (m.userData.spin) m.rotation.y = t * 1.6;
    if (m.userData.restY == null) m.userData.restY = m.position.y;
    if (m.userData.bob) m.position.y = m.userData.restY + Math.sin(t * 2 + (m.userData.phase || 0)) * 0.08;
  });

  if (selected >= 0) {
    const ring = stationGroups[selected].userData.ring;
    const s = 1 + Math.sin(t * 3) * 0.04;
    ring.scale.setScalar(s);
  }

  labelNodes.forEach((n, i) => {
    tmpV.set(0, 2.8, 0);
    n.group.localToWorld(tmpV);
    tmpV.project(camera);
    const x = (tmpV.x * 0.5 + 0.5) * innerWidth;
    const y = (-tmpV.y * 0.5 + 0.5) * innerHeight;
    const vis = tmpV.z < 1 && tmpV.z > -1;
    n.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -120%)`;
    n.el.classList.toggle("on", vis);
  });

  renderer.render(scene, camera);
}

animate();
document.getElementById("loading").classList.add("hide");
setTimeout(() => document.getElementById("loading").remove(), 600);

window.__SAKE_READY = true;
window.__selectStation = (i) => selectStation(i, true);
window.__selectLane = (i) => selectLane(i, true);
window.__stations = STATIONS.map((s) => s.id);
window.__lanes = LANES.map((s) => s.id);
window.__workerCount = () => workers.length;
window.__cargoSample = () => {
  const counts = {};
  cargoItems.forEach((item) => {
    const dist = (item.t * PATH_LEN + beltPos) % PATH_LEN;
    let x;
    if (dist < MAIN_BELT_LEN) x = MAIN_BELT_START + (dist / MAIN_BELT_LEN) * MAIN_BELT_LEN;
    else if (dist < MAIN_BELT_LEN + FAN_LEN) x = ROKA_X + ((dist - MAIN_BELT_LEN) / FAN_LEN) * (BRANCH_X0 - ROKA_X);
    else x = BRANCH_X0 + (dist - MAIN_BELT_LEN - FAN_LEN);
    const st = stageAt(x, dist);
    counts[st] = (counts[st] || 0) + 1;
  });
  return counts;
};
window.__viewCargo = () => {
  selected = -1;
  selectedLane = -1;
  camera.position.set(ORIGIN + PITCH * 3.7, 8.6, 19.5);
  controls.target.set(ORIGIN + PITCH * 3.7, 1.2, 0);
  controls.update();
};

  </script>
